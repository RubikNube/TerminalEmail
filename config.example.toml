[account]
email = "you@example.com"
display_name = "Your Name"
username = "you@example.com"
# Set these if your server does not advertise SPECIAL-USE folders:
# archive_folder = "Archive"
# trash_folder = "Trash"
# sent_folder = "Sent"

[account.imap]
host = "imap.example.com"
port = 993
tls = "implicit"

[account.smtp]
host = "smtp.example.com"
port = 587
tls = "starttls"

[editor]
# command = "nvim" # For message viewing and composing. Otherwise $EDITOR, then vi. No shell expansion.

[display]
# Built-in IDs: default, dark, light, matrix; or a filename stem in themes/ beside this file.
theme = "default"
# Group conversations into selectable, collapsible time sections.
time_grouping = true

[keybindings]
timeout_ms = 750

[keybindings.global]
"j" = "cursor.down"
"k" = "cursor.up"
"gg" = "cursor.first"
"G" = "cursor.last"
"Space t" = "theme.select"
# "Ctrl-j" = "cursor.down"
# "x" = "unbound"

[keybindings.message]
"e" = "message.open_editor"
"]" = "message.next"
"[" = "message.previous"
"S" = "attachment.save"

[keybindings.threads]
"e" = "message.open_editor"
"t" = "threads.toggle_time_grouping"

# Theme picker has isolated bindings: printable keys enter the query.
# [keybindings.theme_picker]
# "Ctrl-n" = "theme_picker.next"
# "Ctrl-p" = "theme_picker.previous"
