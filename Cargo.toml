[package]
name = "terminal-email"
version = "0.1.0"
edition = "2024"
description = "A Vim-inspired terminal email client"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures-util = "0.3"
html2text = "0.16"
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls", "hostname"] }
mail-parser = "0.11"
native-tls = "0.2"
ratatui = "0.30"
rpassword = "7"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tempfile = "3"
textwrap = "0.16"
tokio = { version = "1", features = ["full"] }
tokio-native-tls = "0.3"
toml = "0.9"
toml_edit = "0.25"
unicode-width = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
openssl = "0.10"
